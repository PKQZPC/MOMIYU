<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MOMIYU Chat Verification</title>
<style>body{font:19px sans-serif;margin:30px;max-width:1000px}button,input{font:18px sans-serif;padding:9px;margin:7px}[role=listitem],[role=group][aria-label^=Received]{padding:8px;border-bottom:1px solid #ccc}#history{max-height:560px;overflow:auto}</style>
<h1>Conversation collection verification</h1><button id="switch">Open workshop group</button>
<div id="history" role="log" aria-label="Conversation: Route team"><div role="listitem" aria-label="Received from Jordan at 10:01"><span>Could you bring the route map?</span></div></div>
<form><label>Message input <input aria-label="Message input"></label><button>Send message</button></form>
<div hidden>HIDDEN_CHAT_SENTINEL</div>
<script>
const history=document.querySelector('#history'),input=document.querySelector('input');let count=0;
function message(label,text,extras=[]){const row=document.createElement('div');row.setAttribute('role',history.dataset.layout==='group'?'group':'listitem');row.setAttribute('aria-label',label);for(const value of [text,...extras]){const span=document.createElement('span');span.textContent=value;row.append(span)}history.append(row)}
document.querySelector('form').onsubmit=e=>{e.preventDefault();if(!input.value)return;message('Sent by You at 10:02',input.value);input.value='';if(++count===1)setTimeout(()=>message('Received from Jordan at 10:03','Map received. Please use the sheltered route.',['Reply to: I can bring the route map.','Attachment: route.pdf']),1200)};
document.querySelector('#switch').onclick=()=>{history.setAttribute('aria-label','Conversation: Workshop team');history.dataset.layout='group';history.replaceChildren();message('Received from Casey at 11:01','Bring the measuring tape.');setTimeout(()=>message('Received from Casey at 11:02','The workshop starts at noon.'),1200)};
</script></html>
