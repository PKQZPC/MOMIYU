name: Report a bug
description: Help make your companion feel more at home.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: MOMIYU version or commit
      placeholder: "For example: v0.1.0 or a short commit ID"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Include the steps needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Optional screenshot or error details
      description: Remove credentials and private content before sharing. Synthetic examples are best.
