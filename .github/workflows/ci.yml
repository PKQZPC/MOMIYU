name: Windows tests and offline demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'PKQZPC/MOMIYU'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test runtime, data boundaries, and desktop interaction logic
        run: node --run test
      - name: Run the synthetic offline walkthrough
        run: node --run demo:offline
